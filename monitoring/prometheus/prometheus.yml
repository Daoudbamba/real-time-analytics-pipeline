# Every target is scraped inside the Compose network. A missing target, such as the
# producer outside its profile, shows up as up == 0 rather than as missing data.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: producer
    static_configs:
      - targets: ["producer:8000"]

  # Metrics computed by the Spark driver of the streaming application.
  - job_name: streaming
    static_configs:
      - targets: ["streaming:8001"]

  # Spark's PrometheusServlet only answers on paths that end with a slash.
  - job_name: spark-master
    metrics_path: /metrics/master/prometheus/
    static_configs:
      - targets: ["spark-master:8080"]

  - job_name: spark-worker
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets: ["spark-worker:8081"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Airflow health, read through the Blackbox exporter.
  - job_name: airflow
    metrics_path: /probe
    static_configs:
      - targets: ["http://airflow-scheduler:8974/health"]
        labels:
          module: http_2xx
          component: scheduler
      - targets: ["http://airflow-apiserver:8080/api/v2/monitor/health"]
        labels:
          module: airflow_metadatabase
          component: metadatabase
      - targets: ["http://airflow-apiserver:8080/api/v2/monitor/health"]
        labels:
          module: airflow_dag_processor
          component: dag_processor
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
