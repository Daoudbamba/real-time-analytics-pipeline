# Delta Lake
spark.sql.extensions                     io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog          org.apache.spark.sql.delta.catalog.DeltaCatalog

# Sized for a development laptop: a few cores and small micro-batches.
spark.sql.shuffle.partitions             4
spark.default.parallelism                4
# Delta's default of 50 partitions for each table snapshot dominates small micro-batches.
spark.databricks.delta.snapshotPartitions  4
# Lets the streaming queries share the cores instead of queuing behind each other.
spark.scheduler.mode                     FAIR
spark.sql.session.timeZone               UTC
spark.serializer                         org.apache.spark.serializer.KryoSerializer
# The master only asks a worker it still remembers to reconnect. Multiplied by the 60 s
# worker timeout, this outlives a frozen Docker VM (default 15: about 15 minutes).
spark.dead.worker.persistence            1440

# Structured Streaming
spark.sql.streaming.stateStore.providerClass  org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
spark.sql.streaming.metricsEnabled       true

# Executor metrics on the Spark UI, in Prometheus format
spark.ui.prometheus.enabled              true
